.530" data-duration="5.500" data-track-index="6" data-volume="0.22"></audio><div data-hf-id="hf-8zmp" id="captionRail" data-layout-allow-overlap=""><div data-hf-id="hf-bwl0" id="speaker"></div><div data-hf-id="hf-8af1" id="caption"></div></div><div data-hf-id="hf-o6ww" id="progress"></div></div><script>const tl=gsap.timeline({paused:true});tl.set('#caption',{textContent:"I wanted to see how far I could push Astra"},5.046);tl.set('#speaker',{textContent:'HOST'},5.046);tl.set('#caption',{textContent:"to remake a classic like Prince of Persia."},7.310);tl.set('#speaker',{textContent:'HOST'},7.310);tl.set('#caption',{textContent:"This is the result."},10.143);tl.set('#speaker',{textContent:'HOST'},10.143);tl.set('#caption',{textContent:"Then I wondered: could Astra also make a video explaining"},11.920);tl.set('#speaker',{textContent:'HOST'},11.920);tl.set('#caption',{textContent:"how it coded and created everything?"},15.147);tl.set('#speaker',{textContent:'HOST'},15.147);tl.set('#caption,#speaker',{textContent:''},17.387);tl.set('#caption',{textContent:"When I look at this, I see a palace, a"},27.546);tl.set('#speaker',{textContent:'HOST'},27.546);tl.set('#caption',{textContent:"character, and a lot of ways to die."},29.613);tl.set('#speaker',{textContent:'HOST'},29.613);tl.set('#caption',{textContent:"What does the game see?"},32.411);tl.set('#speaker',{textContent:'HOST'},32.411);tl.set('#caption,#speaker',{textContent:''},33.989);tl.set('#caption',{textContent:"Positions, states, and rules."},34.718);tl.set('#speaker',{textContent:'ASTRA'},34.718);tl.set('#caption',{textContent:"The palace starts as a grid."},37.946);tl.set('#speaker',{textContent:'ASTRA'},37.946);tl.set('#caption',{textContent:"The prince has a position and a movement state."},40.210);tl.set('#speaker',{textContent:'ASTRA'},40.210);tl.set('#caption',{textContent:"A guard checks distance before deciding what to do."},43.135);tl.set('#speaker',{textContent:'ASTRA'},43.135);tl.set('#caption',{textContent:"The interesting part is how those simple systems meet."},46.874);tl.set('#speaker',{textContent:'ASTRA'},46.874);tl.set('#caption',{textContent:"A jump has to look right, land in the right"},50.357);tl.set('#speaker',{textContent:'ASTRA'},50.357);tl.set('#caption',{textContent:"place, and survive whatever is waiting there."},53.097);tl.set('#speaker',{textContent:'ASTRA'},53.097);tl.set('#caption,#speaker',{textContent:''},56.196);tl.set('#caption',{textContent:"The movement has a particular weight to it."},62.558);tl.set('#speaker',{textContent:'HOST'},62.558);tl.set('#caption',{textContent:"How is the character animated?"},65.194);tl.set('#speaker',{textContent:'HOST'},65.194);tl.set('#caption,#speaker',{textContent:''},67.131);tl.set('#caption',{textContent:"The body is built from connected joints."},67.858);tl.set('#speaker',{textContent:'ASTRA'},67.858);tl.set('#caption',{textContent:"Poses describe the angles of the limbs and the position"},70.563);tl.set('#speaker',{textContent:'ASTRA'},70.563);tl.set('#caption',{textContent:"of the torso."},73.744);tl.set('#speaker',{textContent:'ASTRA'},73.744);tl.set('#caption',{textContent:"Blending between those poses creates the movement."},75.161);tl.set('#speaker',{textContent:'ASTRA'},75.161);tl.set('#caption',{textContent:"But a convincing pose is only part of it."},78.679);tl.set('#speaker',{textContent:'ASTRA'},78.679);tl.set('#caption',{textContent:"During a run, the feet need contact with the floor."},81.976);tl.set('#speaker',{textContent:'ASTRA'},81.976);tl.set('#caption',{textContent:"During a climb, the hands need contact with the ledge."},85.424);tl.set('#speaker',{textContent:'ASTRA'},85.424);tl.set('#caption',{textContent:"The code adjusts the limbs around those contact points."},88.803);tl.set('#speaker',{textContent:'ASTRA'},88.803);tl.set('#caption',{textContent:"Watch the landing again."},92.309);tl.set('#speaker',{textContent:'ASTRA'},92.309);tl.set('#caption',{textContent:"The movement through space and the shape of the body"},94.004);tl.set('#speaker',{textContent:'ASTRA'},94.004);tl.set('#caption',{textContent:"are separate pieces, but they have to agree."},96.535);tl.set('#speaker',{textContent:'ASTRA'},96.535);tl.set('#caption,#speaker',{textContent:''},99.784);tl.set('#caption',{textContent:"What makes the guard decide when to attack?"},106.558);tl.set('#speaker',{textContent:'HOST'},106.558);tl.set('#caption,#speaker',{textContent:''},109.134);tl.set('#caption',{textContent:"First, he checks whether the prince is visible and reachable"},109.858);tl.set('#speaker',{textContent:'ASTRA'},109.858);tl.set('#caption',{textContent:"in the same room."},113.213);tl.set('#speaker',{textContent:'ASTRA'},113.213);tl.set('#caption',{textContent:"Then distance matters."},114.514);tl.set('#speaker',{textContent:'ASTRA'},114.514);tl.set('#caption',{textContent:"Too far away, and he can advance."},116.093);tl.set('#speaker',{textContent:'ASTRA'},116.093);tl.set('#caption',{textContent:"Too close, and he can retreat."},118.403);tl.set('#speaker',{textContent:'ASTRA'},118.403);tl.set('#caption',{textContent:"Within range, he may strike."},121.015);tl.set('#speaker',{textContent:'ASTRA'},121.015);tl.set('#caption',{textContent:"He can also react to an incoming attack by blocking."},123.384);tl.set('#speaker',{textContent:'ASTRA'},123.384);tl.set('#caption',{textContent:"Different guards have different aggression, blocking chances, and reaction settings."},127.029);tl.set('#speaker',{textContent:'ASTRA'},127.029);tl.set('#caption',{textContent:"A handful of rules creates a duel with hesitation, pressure,"},132.637);tl.set('#speaker',{textContent:'ASTRA'},132.637);tl.set('#caption',{textContent:"and openings."},136.700);tl.set('#speaker',{textContent:'ASTRA'},136.700);tl.set('#caption,#speaker',{textContent:''},138.208);tl.set('#caption',{textContent:"Which is a fairly elaborate way to ruin my afternoon."},138.938);tl.set('#speaker',{textContent:'HOST'},138.938);tl.set('#caption,#speaker',{textContent:''},142.071);tl.set('#caption',{textContent:"The traps look brutal."},148.558);tl.set('#speaker',{textContent:'HOST'},148.558);tl.set('#caption',{textContent:"What actually decides whether I survive?"},149.986);tl.set('#speaker',{textContent:'HOST'},149.986);tl.set('#caption,#speaker',{textContent:''},152.481);tl.set('#caption',{textContent:"The spikes check where the prince is and how he"},153.196);tl.set('#speaker',{textContent:'ASTRA'},153.196);tl.set('#caption',{textContent:"moves across them."},155.820);tl.set('#speaker',{textContent:'ASTRA'},155.820);tl.set('#caption',{textContent:"Jumping clears them; careful stepping has its own handling."},157.283);tl.set('#speaker',{textContent:'ASTRA'},157.283);tl.set('#caption',{textContent:"The blade trap follows a repeating cycle."},161.498);tl.set('#speaker',{textContent:'ASTRA'},161.498);tl.set('#caption',{textContent:"It closes, stays shut briefly, opens, and waits."},164.551);tl.set('#speaker',{textContent:'ASTRA'},164.551);tl.set('#caption',{textContent:"Its collision check combines the blade's closure with the prince's"},169.137);tl.set('#speaker',{textContent:'ASTRA'},169.137);tl.set('#caption',{textContent:"position."},173.131);tl.set('#speaker',{textContent:'ASTRA'},173.131);tl.set('#caption',{textContent:"That creates the challenge you can see here: recognize the"},174.188);tl.set('#speaker',{textContent:'ASTRA'},174.188);tl.set('#caption',{textContent:"rhythm, choose your moment, and commit."},177.682);tl.set('#speaker',{textContent:'ASTRA'},177.682);tl.set('#caption,#speaker',{textContent:''},181.002);tl.set('#caption',{textContent:"What about the palace itself?"},188.535);tl.set('#speaker',{textContent:'HOST'},188.535);tl.set('#caption',{textContent:"Where does all that detail come from?"},190.532);tl.set('#speaker',{textContent:'HOST'},190.532);tl.set('#caption,#speaker',{textContent:''},192.760);tl.set('#caption',{textContent:"Much of the scene is drawn by code."},193.476);tl.set('#speaker',{textContent:'ASTRA'},193.476);tl.set('#caption',{textContent:"Stone blocks receive variations in color, texture, cracks, and highlights."},195.949);tl.set('#speaker',{textContent:'ASTRA'},195.949);tl.set('#caption',{textContent:"Seeded randomness lets those variations stay consistent when the room"},201.627);tl.set('#speaker',{textContent:'ASTRA'},201.627);tl.set('#caption',{textContent:"is drawn again."},206.572);tl.set('#speaker',{textContent:'ASTRA'},206.572);tl.set('#caption',{textContent:"Then other layers add depth: distant architecture, recessed surfaces, lamps,"},208.279);tl.set('#speaker',{textContent:'ASTRA'},208.279);tl.set('#caption',{textContent:"shadows, and light."},214.537);tl.set('#speaker',{textContent:'ASTRA'},214.537);tl.set('#caption',{textContent:"Small marks do different jobs."},216.870);tl.set('#speaker',{textContent:'ASTRA'},216.870);tl.set('#caption',{textContent:"A bright edge suggests a surface catching light."},219.274);tl.set('#speaker',{textContent:'ASTRA'},219.274);tl.set('#caption',{textContent:"A dark recess suggests thickness."},222.850);tl.set('#speaker',{textContent:'ASTRA'},222.850);tl.set('#caption',{textContent:"Together, they make a flat drawing feel like a place."},225.845);tl.set('#speaker',{textContent:'ASTRA'},225.845);tl.set('#caption,#speaker',{textContent:''},229.361);tl.set('#caption',{textContent:"How do you turn those rooms into a level?"},235.600);tl.set('#speaker',{textContent:'HOST'},235.600);tl.set('#caption,#speaker',{textContent:''},237.839);tl.set('#caption',{textContent:"The map places floors, gaps, hazards, items, and mechanisms."},238.568);tl.set('#speaker',{textContent:'ASTRA'},238.568);tl.set('#caption',{textContent:"Connections give those pieces a purpose."},244.327);tl.set('#speaker',{textContent:'ASTRA'},244.327);tl.set('#caption',{textContent:"A plate opens a gate elsewhere."},247.473);tl.set('#speaker',{textContent:'ASTRA'},247.473);tl.set('#caption',{textContent:"A loose tile changes where you can go."},249.702);tl.set('#speaker',{textContent:'ASTRA'},249.702);tl.set('#caption',{textContent:"A sword changes how you can deal with a guard."},252.442);tl.set('#speaker',{textContent:'ASTRA'},252.442);tl.set('#caption',{textContent:"The player experiences a sequence of discoveries."},255.553);tl.set('#speaker',{textContent:'ASTRA'},255.553);tl.set('#caption',{textContent:"First, learn an action."},259.268);tl.set('#speaker',{textContent:'ASTRA'},259.268);tl.set('#caption',{textContent:"Then recognize where to use it."},260.801);tl.set('#speaker',{textContent:'ASTRA'},260.801);tl.set('#caption',{textContent:"Finally, combine it with something else under pressure."},263.181);tl.set('#speaker',{textContent:'ASTRA'},263.181);tl.set('#caption,#speaker',{textContent:''},266.918);tl.set('#caption',{textContent:"Did all of this come together in a single pass,"},273.588);tl.set('#speaker',{textContent:'HOST'},273.588);tl.set('#caption',{textContent:"or how many back-and-forth iterations did it actually take?"},276.154);tl.set('#speaker',{textContent:'HOST'},276.154);tl.set('#caption,#speaker',{textContent:''},279.461);tl.set('#caption',{textContent:"Far from a single pass."},280.165);tl.set('#speaker',{textContent:'ASTRA'},280.165);tl.set('#caption',{textContent:"It took constant back-and-forth iteration."},282.220);tl.set('#speaker',{textContent:'ASTRA'},282.220);tl.set('#caption',{textContent:"There's a huge gap between an action just working in"},285.192);tl.set('#speaker',{textContent:'ASTRA'},285.192);tl.set('#caption',{textContent:"code and an action looking convincing."},288.373);tl.set('#speaker',{textContent:'ASTRA'},288.373);tl.set('#caption',{textContent:"A hand has to meet the sword's grip."},291.670);tl.set('#speaker',{textContent:'ASTRA'},291.670);tl.set('#caption',{textContent:"A bottle has to meet the character's mouth."},294.236);tl.set('#speaker',{textContent:'ASTRA'},294.236);tl.set('#caption',{textContent:"A foot has to settle against the floor."},296.860);tl.set('#speaker',{textContent:'ASTRA'},296.860);tl.set('#caption',{textContent:"Here is an example of one iteration."},299.310);tl.set('#speaker',{textContent:'ASTRA'},299.310);tl.set('#caption',{textContent:"On the left, the bottle follows the hand, but stays"},302.282);tl.set('#speaker',{textContent:'ASTRA'},302.282);tl.set('#caption',{textContent:"upright throughout the drinking animation."},305.568);tl.set('#speaker',{textContent:'ASTRA'},305.568);tl.set('#caption',{textContent:"On the right, it tips toward the prince's lips, pauses"},308.261);tl.set('#speaker',{textContent:'ASTRA'},308.261);tl.set('#caption',{textContent:"for the drink, and lowers again."},311.895);tl.set('#speaker',{textContent:'ASTRA'},311.895);tl.set('#caption',{textContent:"Watch the liquid, too."},314.275);tl.set('#speaker',{textContent:'ASTRA'},314.275);tl.set('#caption',{textContent:"Its surface stays level as the bottle rotates, and the"},316.144);tl.set('#speaker',{textContent:'ASTRA'},316.144);tl.set('#caption',{textContent:"amount decreases as he drinks."},319.627);tl.set('#speaker',{textContent:'ASTRA'},319.627);tl.set('#caption',{textContent:"The pickup hint also moves below the character, so it"},322.402);tl.set('#speaker',{textContent:'ASTRA'},322.402);tl.set('#caption',{textContent:"no longer covers the action."},325.792);tl.set('#speaker',{textContent:'ASTRA'},325.792);tl.set('#caption',{textContent:"These are small changes, but together they make the action"},328.219);tl.set('#speaker',{textContent:'ASTRA'},328.219);tl.set('#caption',{textContent:"much easier to read, and much more convincing."},331.621);tl.set('#speaker',{textContent:'ASTRA'},331.621);tl.set('#caption,#speaker',{textContent:''},335.752);tl.set('#caption',{textContent:"How much of the impact comes from sound?"},343.600);tl.set('#speaker',{textContent:'HOST'},343.600);tl.set('#caption,#speaker',{textContent:''},346.118);tl.set('#caption',{textContent:"Listen to the landing without it."},346.836);tl.set('#speaker',{textContent:'ASTRA'},346.836);tl.set('#caption',{textContent:"Now add the impact."},348.949);tl.set('#speaker',{textContent:'ASTRA'},348.949);tl.set('#caption',{textContent:"The picture hasn't changed, but the action feels heavier."},351.121);tl.set('#speaker',{textContent:'ASTRA'},351.121);tl.set('#caption',{textContent:"This game synthesizes its audio using tones and filtered noise."},354.859);tl.set('#speaker',{textContent:'ASTRA'},354.859);tl.set('#caption',{textContent:"Short envelopes shape footsteps, impacts, and other effects."},359.573);tl.set('#speaker',{textContent:'ASTRA'},359.573);tl.set('#caption',{textContent:"The music is also built from programmed notes and rhythms."},364.054);tl.set('#speaker',{textContent:'ASTRA'},364.054);tl.set('#caption,#speaker',{textContent:''},367.814);tl.set('#caption',{textContent:"For this film, we can build on that with ElevenLabs"},368.538);tl.set('#speaker',{textContent:'HOST'},368.538);tl.set('#caption',{textContent:"narration, atmosphere, and additional sound effects."},370.999);tl.set('#speaker',{textContent:'HOST'},370.999);tl.set('#caption,#speaker',{textContent:''},374.411);tl.set('#caption',{textContent:"So when I press jump, I'm seeing more than a"},381.588);tl.set('#speaker',{textContent:'HOST'},381.588);tl.set('#caption',{textContent:"jump?"},383.736);tl.set('#speaker',{textContent:'HOST'},383.736);tl.set('#caption,#speaker',{textContent:''},384.489);tl.set('#caption',{textContent:"You're seeing movement, a changing pose, contact with the environment,"},385.218);tl.set('#speaker',{textContent:'ASTRA'},385.218);tl.set('#caption',{textContent:"collision rules, and sound working together."},390.001);tl.set('#speaker',{textContent:'ASTRA'},390.001);tl.set('#caption',{textContent:"The same is true of the duel, the traps, and"},393.612);tl.set('#speaker',{textContent:'ASTRA'},393.612);tl.set('#caption',{textContent:"the palace around them."},396.445);tl.set('#speaker',{textContent:'ASTRA'},396.445);tl.set('#caption',{textContent:"Each piece can be understood on its own."},398.233);tl.set('#speaker',{textContent:'ASTRA'},398.233);tl.set('#caption',{textContent:"The game comes alive when they agree."},401.240);tl.set('#speaker',{textContent:'ASTRA'},401.240);tl.set('#caption,#speaker',{textContent:''},404.002);tl.set('#caption',{textContent:"And after all that explanation, I still have to time"},404.716);tl.set('#speaker',{textContent:'HOST'},404.716);tl.set('#caption',{textContent:"the blade."},407.364);tl.set('#speaker',{textContent:'HOST'},407.364);tl.set('#caption,#speaker',{textContent:''},408.326);tl.fromTo('#progress',{scaleX:0},{scaleX:1,transformOrigin:'left',duration:416.03,ease:'none'},0);window.__timelines['main']=tl;</script></body></html>
